services:
  web:
    build: .
    expose:
      - "5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/flask_app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web